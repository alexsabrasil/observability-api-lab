
groups:
  - name: node_api_alerts
    rules:
      - alert: ApiDown
        expr: up{job="node_api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API indisponível"
          description: "O Prometheus não consegue coletar métricas da API."

      - alert: HighHttp5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="node_api",status_code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="node_api"}[5m])), 0.001)
          ) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Taxa elevada de erros HTTP 5xx"

      - alert: HighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(http_request_duration_seconds_bucket{job="node_api"}[5m])
            )
          ) > 0.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Latência P95 superior a 500 ms"

      - alert: HighNodeMemoryUsage
        expr: process_resident_memory_bytes{job="node_api"} > 314572800
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Uso de memória da API acima de 300 MiB"
